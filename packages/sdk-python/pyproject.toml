[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetkit"
version = "0.3.0"
description = "Python SDK for FleetKit — enqueue jobs, register workers, heartbeats"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bogdan Shcherbinin" }]
dependencies = [
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
