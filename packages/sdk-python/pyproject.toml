[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetkit"
version = "0.1.0"
description = "Python SDK for FleetKit — enqueue jobs, register workers, heartbeats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bogdan Shcherbinin" }]
keywords = ["fleetkit", "workers", "jobs", "automation", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/blessed-bless/fleetkit"
Documentation = "https://github.com/blessed-bless/fleetkit/blob/master/docs/api.md"
Changelog = "https://github.com/blessed-bless/fleetkit/blob/master/CHANGELOG.md"
Issues = "https://github.com/blessed-bless/fleetkit/issues"
Releases = "https://github.com/blessed-bless/fleetkit/releases"

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
