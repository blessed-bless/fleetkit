services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetkit
      POSTGRES_PASSWORD: fleetkit
      POSTGRES_DB: fleetkit
    ports:
      - "5432:5432"
    volumes:
      - fleetkit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetkit -d fleetkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - fleetkit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
    environment:
      FLEETKIT_ENV: development
      FLEETKIT_DATABASE_URL: postgresql+asyncpg://fleetkit:fleetkit@postgres:5432/fleetkit
      FLEETKIT_REDIS_URL: redis://redis:6379/0
      FLEETKIT_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      FLEETKIT_SECRET_KEY: docker-dev-secret-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "fleetkit_worker"]
    env_file:
      - .env.example
    environment:
      FLEETKIT_ENV: development
      FLEETKIT_DATABASE_URL: postgresql+asyncpg://fleetkit:fleetkit@postgres:5432/fleetkit
      FLEETKIT_REDIS_URL: redis://redis:6379/0
      FLEETKIT_SECRET_KEY: docker-dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  fleetkit_pg:
  fleetkit_redis:
