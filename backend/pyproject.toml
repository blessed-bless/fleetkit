[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetkit-backend"
version = "0.1.0"
description = "FleetKit API and worker runtime — control plane for automation fleets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bogdan Shcherbinin", email = "blessed-bless@users.noreply.github.com" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<4.1",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.17",
  "croniter>=5.0.1",
  "orjson>=3.10.0",
  "email-validator>=2.2.0",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
]

[project.scripts]
fleetkit-api = "fleetkit_api.main:run"
fleetkit-worker = "fleetkit_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fleetkit_api*", "fleetkit_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI Depends/Header in defaults is idiomatic
  "E501",  # long Russian error strings / SQLAlchemy columns
  "UP042", # str Enum kept for SQLAlchemy compatibility
]
